<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio das tabelas</title>
</head>
<body>
    <h1>Desafio das tabelas</h1>

    <hr>

    <table border="2">
        <thead>
            <h2>Times de Futebol</h2>                   
        </thead>        
        <tbody>
            <th colspan="2">Brasil</th>
            <tr>
                <th>Estado</th>
                <th>Time</th>
            </tr>
            <tr>
                <td rowspan="4">São Paulo  
                </td>
                <td>Corinthians</td>
            </tr>
            <tr>
                <td>Palmeiras</td>
            </tr>
            <tr>
                <td>São Paulo</td>
            </tr>
            <tr>
                <td>Santos</td>
            </tr>
            <tr>
            <td rowspan="4">Rio de Janeiro       
            </td>
            <td>Botafogo</td>
            </tr>
            <tr>
                <td>Flamengo</td>
            </tr>
            <tr>
                <td>Fluminense</td>
            </tr>
            <tr>
                <td>Vasco</td>
            </tr>    
        </tbody>     
    </table>

    <hr>

    <table border="2">
        <thead>
            <h2>Tabela de Preços</h2>    
        </thead>
        <tbody>
            <th colspan="4"></th>
            <tr>
                <th>Produto</th>
            </tr>

        </tbody>




    </table>


</body>
</html>
